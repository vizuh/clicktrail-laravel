# CI gate: syntax, dependency resolution, and package-specific assertions.
# Platform integration tests require the host CMS and are tracked separately.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vizuh/clicktrail-php
          path: sdk
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Point Composer at the SDK checkout
        run: |
          set -euo pipefail
          if grep -q '"../clicktrail-php"' composer.json; then
            sed -i 's#"../clicktrail-php"#"sdk"#g' composer.json
          elif grep -q '"clicktrail/php-sdk"' composer.json; then
            composer config repositories.clicktrail-sdk path sdk
          fi
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --strict
      - name: Install dependencies (strict)
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run standalone assertions
        env:
          CLICKTRAIL_APP_ROOT: ${{ github.workspace }}
          CLICKTRAIL_SDK_ROOT: ${{ github.workspace }}/sdk
        run: php tests/_runner.php
