version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      composer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
